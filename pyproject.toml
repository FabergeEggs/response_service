[project]
name = "response_service"
version = "0.1.0"
description = "description"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "aiokafka>=0.12.0",
    "asyncpg>=0.30.0",
    "psycopg-pool>=3.3.1",
    "psycopg2-binary>=2.9.12",
    "yoyo-migrations>=9.0.0",
    "uvicorn>=0.48.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.29",
]

[project.scripts]
migrate = "src.migrations_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
